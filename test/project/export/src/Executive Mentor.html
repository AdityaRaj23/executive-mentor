<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Executive Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --color-primary: #0F292F;
    --color-bg: #050A0F;
    --color-surface: rgba(20, 30, 40, 0.6);
    --color-surface-solid: #141E28;
    --color-text: #F0F4F8;
    --color-muted: #829AB1;
    --color-accent: #10B981;
    --color-amber: #F59E0B;
    --color-rose: #EF4444;
    --color-sapphire: #0EA5E9;
    --font-heading: 'Cormorant Garamond', 'Times New Roman', serif;
    --font-body: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 2px;
    --hairline: 1px solid rgba(255, 255, 255, 0.08);
    --hairline-strong: 1px solid rgba(255, 255, 255, 0.16);
    --shadow-card: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: var(--bg-grad-1, radial-gradient(1200px 600px at 80% -10%, rgba(16,185,129,0.06), transparent 60%)),
                var(--bg-grad-2, radial-gradient(900px 500px at -10% 110%, rgba(14,165,233,0.05), transparent 60%));
    background-color: transparent;
    pointer-events: none;
    z-index: 0;
    transition: background 0.6s ease;
  }
  html { transition: background-color 0.6s ease, color 0.6s ease; }
  .glass, button, input, .h-serif, h1, h2, h3, h4, p, span, div {
    transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }
  #root { position: relative; z-index: 1; }
  ::selection { background: var(--color-accent); color: var(--color-bg); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(130, 154, 177, 0.2); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(130, 154, 177, 0.4); }

  .glass {
    background: var(--color-surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: var(--hairline);
    border-radius: var(--radius);
  }
  .h-serif { font-family: var(--font-heading); font-weight: 600; letter-spacing: -0.01em; }
  .mono { font-family: var(--font-mono); }
  .uc { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; }

  button { font-family: inherit; }
  input, textarea { font-family: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes pulseRing {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
    100% { box-shadow: 0 0 0 14px rgba(16,185,129,0); }
  }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .shimmer {
    background: linear-gradient(90deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.02) 100%);
    background-size: 800px 100%;
    animation: shimmer 1.6s infinite linear;
  }

  /* ─── Light-mode overrides ────────────────────────────────────────────────
     Many components use literal rgba(255,255,255,X) tints (subtle white-on-dark
     overlays). On a light bg these become invisible, so flip them to dark tints.
     Uses CSS attribute selector + ~ combinator on the body to override any inline
     style that uses the white-tint hex string we don't control.                */
  html[data-mode="light"] {
    color-scheme: light;
  }
  /* Replace the pre-rendered selection style for light mode */
  html[data-mode="light"] ::selection { background: var(--color-accent); color: #FFFFFF; }
  html[data-mode="light"] ::-webkit-scrollbar-thumb { background: rgba(15, 26, 36, 0.18); }
  html[data-mode="light"] ::-webkit-scrollbar-thumb:hover { background: rgba(15, 26, 36, 0.32); }

  /* Promote inline white-tint backgrounds to dark-tint equivalents in light mode.
     These selectors target the most common card/surface patterns by attribute
     match on the inline style string the components write.                      */
  html[data-mode="light"] [style*="rgba(255,255,255,0.02)"],
  html[data-mode="light"] [style*="rgba(255, 255, 255, 0.02)"] {
    background-color: rgba(15, 26, 36, 0.025) !important;
  }
  html[data-mode="light"] [style*="rgba(255,255,255,0.03)"],
  html[data-mode="light"] [style*="rgba(255, 255, 255, 0.03)"] {
    background-color: rgba(15, 26, 36, 0.035) !important;
  }
  html[data-mode="light"] [style*="rgba(255,255,255,0.04)"],
  html[data-mode="light"] [style*="rgba(255, 255, 255, 0.04)"] {
    background-color: rgba(15, 26, 36, 0.05) !important;
  }
  html[data-mode="light"] [style*="rgba(255,255,255,0.05)"],
  html[data-mode="light"] [style*="rgba(255, 255, 255, 0.05)"] {
    background-color: rgba(15, 26, 36, 0.06) !important;
  }
  html[data-mode="light"] [style*="rgba(255,255,255,0.06)"],
  html[data-mode="light"] [style*="rgba(255, 255, 255, 0.06)"] {
    background-color: rgba(15, 26, 36, 0.07) !important;
  }

  /* The shimmer effect itself */
  html[data-mode="light"] .shimmer {
    background: linear-gradient(90deg, rgba(15,26,36,0.02) 0%, rgba(15,26,36,0.06) 50%, rgba(15,26,36,0.02) 100%);
    background-size: 800px 100%;
  }
</style>
</head>
